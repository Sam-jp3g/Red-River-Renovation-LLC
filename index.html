<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Work | Red River Renovation</title>
<style>
:root{--ink:#27373b;--red:#b64e50;--aqua:#c5e7e9;--white:#fafaf6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 26% 24%,#d5eeef 0%,transparent 37%),radial-gradient(ellipse at 88% 64%,#d9eeee 0%,transparent 40%),repeating-linear-gradient(110deg,transparent 0 85px,#b6dade18 90px 105px,transparent 130px 230px),#f7f8f4;min-height:100vh}header{text-align:center;padding:24px 16px 15px;max-width:950px;margin:auto}.brand{font-size:clamp(27px,5vw,51px);letter-spacing:.10em;font-variant:small-caps;color:#35484d}.subtitle{font-size:clamp(12px,2.5vw,17px);letter-spacing:.16em;text-transform:uppercase;margin:3px 0 15px}.rule{height:2px;background:var(--red);position:relative;margin:0 auto 24px;max-width:800px}.rule:before,.rule:after{content:'◇';position:absolute;color:var(--red);font-size:24px;top:-15px}.rule:before{left:-7px}.rule:after{right:-7px}.eyebrow{letter-spacing:.20em;color:#855f60;font:12px system-ui,sans-serif;text-transform:uppercase}h1{font-size:clamp(31px,5vw,58px);font-weight:normal;margin:5px 0 8px}.intro{font:14px/1.6 system-ui,sans-serif;color:#647378;margin:0 auto 20px;max-width:470px}.wrap{width:min(850px,94%);margin:auto}.tabs{display:flex;gap:9px;overflow-x:auto;padding:8px 2px 15px;scrollbar-width:thin}.tab{flex:none;border:1px solid #b8cacb;border-radius:2px;padding:10px 14px;background:#fffc;color:#35484d;font:12px system-ui,sans-serif;cursor:pointer}.tab.active{background:#35484d;color:#fff;border-color:#35484d}.viewer{position:relative;overflow:hidden;aspect-ratio:4/3;max-height:570px;border:1px solid #bdcdd0;background:#e7eff0;touch-action:pan-y;user-select:none}.viewer img{height:100%;width:100%;object-fit:contain;display:none}.missing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:#52696f;font:15px/1.6 system-ui,sans-serif}.missing strong{font:30px Georgia,serif}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #d7e1e1;background:#fffffff0;color:#233e43;width:44px;height:44px;border-radius:50%;font-size:28px;cursor:pointer;z-index:2}.prev{left:12px}.next{right:12px}.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 2px 15px}.caption{font-size:clamp(16px,2.8vw,23px)}.counter{color:#6b7579;font:13px system-ui,sans-serif;white-space:nowrap}.hint{text-align:center;color:#718285;font:12px system-ui,sans-serif;margin:0 0 30px}.footerline{border-top:2px solid var(--red);padding:17px 0 35px;text-align:center;letter-spacing:.08em}.home{color:#33454a;text-decoration:underline;text-underline-offset:4px;font-size:15px}@media(max-width:640px){header{padding-top:24px}.wrap{width:100%;padding:0 12px}.viewer{aspect-ratio:4/5;max-height:70vh}.tab{padding:10px 12px}.arrow{width:40px;height:40px}.brand{font-size:30px}.footerline{margin:0 12px}}
</style>
</head>
<body>
<header><div class="brand">RED RIVER</div><div class="subtitle">RENOVATION, LLC</div><div class="rule"></div><div class="eyebrow">From Concept to Reality</div><h1>OUR WORK</h1><p class="intro">Browse our completed projects. Swipe left or right on your phone to explore.</p></header>
<main class="wrap"><nav class="tabs" id="tabs" aria-label="Filter project type"></nav><section aria-label="Renovation project slideshow"><div class="viewer" id="viewer"><img id="photo" alt="Renovation project"><div class="missing" id="missing"><strong>Project photograph</strong><span>Add the matching images to the <b>photos</b> folder to display the client's work.</span></div><button class="arrow prev" id="prev" aria-label="Previous photograph">‹</button><button class="arrow next" id="next" aria-label="Next photograph">›</button></div><div class="meta"><div class="caption" id="caption"></div><div class="counter" id="counter"></div></div><p class="hint">← Swipe on mobile or use the arrows →</p></section><div class="footerline"><a class="home" id="back" href="#">BACK TO MAIN WEBSITE</a></div></main>
<script>
// EDIT THIS LIST when adding real photos. Use images your client approved for publication.
const projects = [
 {file:'photos/photo1.jpg',category:'Room Additions',title:'Room / Bar Addition — Oak Island, NC'},
 {file:'photos/photo2.jpg',category:'Room Additions',title:'Custom Efficiency Studio — Oak Island, NC'},
 {file:'photos/photo3.jpg',category:'Room Additions',title:'Four Seasons Room — Southport, NC'},
 {file:'photos/photo4.jpg',category:'Kitchens',title:'Kitchenette — Oak Island, NC'},
 {file:'photos/photo5.jpg',category:'Kitchens',title:'Kitchen Spruce Up — Sunset Beach, NC'},
 {file:'photos/photo6.jpg',category:'Gym Builds',title:'Home Gym Project'}
];
// Later replace # with your client's published Canva website address.
const MAIN_WEBSITE_URL = '#'; document.getElementById('back').href=MAIN_WEBSITE_URL;
let category='All',position=0;const $=id=>document.getElementById(id);
const categories=['All',...new Set(projects.map(p=>p.category))];
function filtered(){return projects.filter(p=>category==='All'||p.category===category)}
function drawTabs(){ $('tabs').innerHTML='';categories.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c===category?' active':'');b.textContent=c;b.onclick=()=>{category=c;position=0;drawTabs();render()};$('tabs').appendChild(b)})}
function render(){const photos=filtered();if(!photos.length)return;position=(position+photos.length)%photos.length;const item=photos[position],img=$('photo');img.style.display='none';$('missing').style.display='flex';img.onload=()=>{img.style.display='block';$('missing').style.display='none'};img.onerror=()=>{img.style.display='none';$('missing').style.display='flex'};img.alt=item.title;img.src=item.file;$('caption').textContent=item.title;$('counter').textContent=(position+1)+' / '+photos.length}
function move(delta){position+=delta;render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
let startX=0,startY=0;$('viewer').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});$('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});drawTabs();render();
</script>
</body></html>
